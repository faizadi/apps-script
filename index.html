<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen RICEF SAP</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Konfigurasi Tailwind untuk Dark Mode berbasis Class -->
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- DataTables Tailwind CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/2.0.3/css/dataTables.tailwindcss.css">
    
    <style>
        /* Transisi halus saat ganti tema */
        body { transition: background-color 0.3s ease, color 0.3s ease; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 font-sans min-h-screen">

<!-- Tombol Toggle Dark Mode Global (Pojok Kanan Atas) -->
<div class="absolute top-4 right-4 z-50">
    <button onclick="toggleDarkMode()" class="p-2 bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-yellow-300 rounded-full shadow hover:bg-gray-300 dark:hover:bg-gray-600 transition" id="themeToggleBtn">
        🌙
    </button>
</div>

<!-- HALAMAN LOGIN -->
<div class="min-h-screen flex items-center justify-center p-4" id="loginPage">
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-8 w-full max-w-md border border-gray-100 dark:border-gray-700 transition-colors">
        <h4 class="text-2xl font-bold text-center text-gray-800 dark:text-white mb-6">Login RICEF Tracker</h4>
        <form id="loginForm">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Username</label>
                <input type="text" class="w-full bg-white dark:bg-gray-700 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none transition-colors" name="username" required>
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Password</label>
                <input type="password" class="w-full bg-white dark:bg-gray-700 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none transition-colors" name="password" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md transition duration-200" id="loginBtn">Masuk</button>
        </form>
    </div>
</div>

<!-- HALAMAN UTAMA APLIKASI -->
<div class="container mx-auto px-4 py-12 max-w-6xl" id="appPage" style="display: none;">
    <div class="flex justify-between items-center mb-8">
        <h2 class="text-3xl font-bold text-gray-800 dark:text-white">RICEF Tracker SAP</h2>
        <button class="bg-red-500 hover:bg-red-600 text-white font-medium py-2 px-4 rounded-md transition duration-200 shadow-sm" onclick="logout()">Logout</button>
    </div>
    
    <!-- Form Input -->
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow border border-gray-200 dark:border-gray-700 p-6 mb-8 transition-colors">
        <form id="ricefForm">
            <input type="hidden" id="ricefId" name="id">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                <div class="col-span-1">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Type</label>
                    <select class="w-full bg-white dark:bg-gray-700 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none" id="type" name="type" required>
                        <option value="Report">Report</option>
                        <option value="Interface">Interface</option>
                        <option value="Conversion">Conversion</option>
                        <option value="Enhancement">Enhancement</option>
                        <option value="Form">Form</option>
                    </select>
                </div>
                <div class="col-span-1">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Module</label>
                    <input type="text" class="w-full bg-white dark:bg-gray-700 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none" id="module" name="module" required>
                </div>
                <div class="col-span-1">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Program Name</label>
                    <input type="text" class="w-full bg-white dark:bg-gray-700 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none" id="program_name" name="program_name" required>
                </div>
                <div class="col-span-1">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Status</label>
                    <select class="w-full bg-white dark:bg-gray-700 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none" id="status" name="status" required>
                        <option value="Not Started">Not Started</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Testing">Testing</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Description</label>
                <textarea class="w-full bg-white dark:bg-gray-700 text-gray-900 dark:text-white border border-gray-300 dark:border-gray-600 rounded-md p-2 focus:ring-2 focus:ring-blue-500 outline-none" id="description" name="description" rows="2" required></textarea>
            </div>
            <div class="flex gap-2">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-md transition duration-200" id="saveBtn">Simpan Data</button>
                <button type="button" class="hidden bg-gray-500 hover:bg-gray-600 text-white font-medium py-2 px-6 rounded-md transition duration-200" id="cancelBtn" onclick="resetForm()">Batal</button>
            </div>
        </form>
    </div>

    <!-- Table Data -->
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow border border-gray-200 dark:border-gray-700 p-6 mb-8 transition-colors">
        <div class="overflow-x-auto">
            <!-- DataTables secara otomatis akan mengikuti kelas dark jika <html> menggunakan class "dark" -->
            <table id="ricefTable" class="w-full text-left border-collapse stripe hover text-gray-800 dark:text-gray-200">
                <thead>
                    <tr class="bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 border-b dark:border-gray-600">
                        <th class="p-3 text-sm font-semibold">ID</th>
                        <th class="p-3 text-sm font-semibold">Type</th>
                        <th class="p-3 text-sm font-semibold">Module</th>
                        <th class="p-3 text-sm font-semibold">Program Name</th>
                        <th class="p-3 text-sm font-semibold">Description</th>
                        <th class="p-3 text-sm font-semibold">Status</th>
                        <th class="p-3 text-sm font-semibold">Aksi</th>
                    </tr>
                </thead>
                <tbody class="text-sm">
                    <!-- Data dari Apps Script -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- jQuery & DataTables JS -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/2.0.3/js/dataTables.js"></script>
<script src="https://cdn.datatables.net/2.0.3/js/dataTables.tailwindcss.js"></script>

<script>
    // MASUKKAN URL DEPLOYMENT ANDA DI BAWAH INI
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxM39Ofq8lLmyPbStcSIDN7QMpZ77it78P0XsxtMa3Ghp-fhYRdIXqlN8GN5cpwaBLs/exec';
    let dataTable;

    // --- LOGIKA DARK MODE ---
    function applyTheme() {
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('themeToggleBtn').innerText = '☀️';
        } else {
            document.documentElement.classList.remove('dark');
            document.getElementById('themeToggleBtn').innerText = '🌙';
        }
    }

    function toggleDarkMode() {
        if (document.documentElement.classList.contains('dark')) {
            document.documentElement.classList.remove('dark');
            localStorage.theme = 'light';
            document.getElementById('themeToggleBtn').innerText = '🌙';
        } else {
            document.documentElement.classList.add('dark');
            localStorage.theme = 'dark';
            document.getElementById('themeToggleBtn').innerText = '☀️';
        }
    }
    
    // Terapkan tema saat pertama kali load
    applyTheme();

    $(document).ready(function() {
        dataTable = $('#ricefTable').DataTable({
            responsive: true,
            language: { search: "Cari:", lengthMenu: "Tampil _MENU_ data" }
        });
        checkLoginStatus();
    });

    function checkLoginStatus() {
        const token = sessionStorage.getItem('authToken');
        if(token) {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('appPage').style.display = 'block';
            loadData();
        }
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        formData.append('action', 'login');
        const btn = document.getElementById('loginBtn');
        btn.innerText = "Memeriksa...";
        btn.disabled = true;

        fetch(SCRIPT_URL, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(res => {
                if(res.status === 'success') {
                    sessionStorage.setItem('authToken', res.token); 
                    document.getElementById('loginPage').style.display = 'none';
                    document.getElementById('appPage').style.display = 'block';
                    loadData();
                } else {
                    alert('Username atau Password Salah!');
                }
                btn.innerText = "Masuk";
                btn.disabled = false;
            }).catch(err => {
                alert('Terjadi kesalahan jaringan.');
                btn.innerText = "Masuk";
                btn.disabled = false;
            });
    });

    function logout() {
        sessionStorage.removeItem('authToken');
        document.getElementById('appPage').style.display = 'none';
        document.getElementById('loginPage').style.display = 'flex';
        document.getElementById('loginForm').reset();
    }

    function loadData() {
        const token = sessionStorage.getItem('authToken');
        if(!token) return;

        fetch(SCRIPT_URL + '?action=read&token=' + token)
            .then(res => res.json())
            .then(res => {
                if(res.status === 'error') {
                    alert('Akses Ditolak: ' + res.message);
                    logout();
                    return;
                }
                
                dataTable.clear(); 
                if(res.data && res.data.length > 0) {
                    res.data.forEach(row => {
                        const descSafe = (row.Description || "").replace(/'/g, "\\'").replace(/"/g, "&quot;"); 
                        dataTable.row.add([
                            row.ID,
                            `<span class="bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 px-2 py-1 rounded text-xs font-semibold">${row.Type}</span>`,
                            row.Module,
                            `<strong class="text-blue-600 dark:text-blue-400">${row.Program_Name}</strong>`,
                            row.Description,
                            getStatusBadge(row.Status),
                            `<div class="flex gap-1">
                                <button class="bg-yellow-500 hover:bg-yellow-600 text-white text-xs py-1 px-3 rounded transition" onclick="editData('${row.ID}', '${row.Type}', '${row.Module}', '${row.Program_Name}', '${descSafe}', '${row.Status}')">Edit</button>
                                <button class="bg-red-500 hover:bg-red-600 text-white text-xs py-1 px-3 rounded transition" onclick="deleteData('${row.ID}')">Hapus</button>
                            </div>`
                        ]);
                    });
                }
                dataTable.draw(); 
            }).catch(err => console.error('Gagal Load Data:', err));
    }

    document.getElementById('ricefForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const token = sessionStorage.getItem('authToken');
        const id = document.getElementById('ricefId').value;
        const action = id ? 'update' : 'create';
        
        const formData = new FormData(this);
        formData.append('action', action);
        formData.append('token', token); 

        const btn = document.getElementById('saveBtn');
        btn.innerText = "Menyimpan...";
        btn.disabled = true;

        fetch(SCRIPT_URL, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(res => {
                if(res.status === 'error') {
                    alert('Gagal: ' + res.message);
                } else {
                    resetForm();
                    loadData();
                }
                btn.disabled = false;
            }).catch(err => {
                alert("Gagal menghubungi server.");
                btn.disabled = false;
                btn.innerText = "Simpan Data";
            });
    });

    function deleteData(id) {
        if(confirm('Yakin ingin menghapus RICEF ini?')) {
            const token = sessionStorage.getItem('authToken');
            const formData = new FormData();
            formData.append('action', 'delete');
            formData.append('id', id);
            formData.append('token', token); 

            fetch(SCRIPT_URL, { method: 'POST', body: formData })
                .then(res => res.json())
                .then(res => {
                    if(res.status === 'error') {
                        alert('Gagal menghapus: ' + res.message);
                    } else {
                        loadData();
                    }
                });
        }
    }

    function editData(id, type, module, prog_name, desc, status) {
        document.getElementById('ricefId').value = id;
        document.getElementById('type').value = type;
        document.getElementById('module').value = module;
        document.getElementById('program_name').value = prog_name;
        document.getElementById('description').value = desc;
        document.getElementById('status').value = status;
        
        document.getElementById('saveBtn').innerText = "Update Data";
        document.getElementById('cancelBtn').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
        document.getElementById('ricefForm').reset();
        document.getElementById('ricefId').value = '';
        document.getElementById('saveBtn').innerText = "Simpan Data";
        document.getElementById('cancelBtn').classList.add('hidden');
    }

    function getStatusBadge(status) {
        switch(status) {
            case 'Completed': return `<span class="bg-green-100 text-green-800 dark:bg-green-900 dark:text-green-200 px-2 py-1 rounded text-xs font-semibold">${status}</span>`;
            case 'Testing': return `<span class="bg-purple-100 text-purple-800 dark:bg-purple-900 dark:text-purple-200 px-2 py-1 rounded text-xs font-semibold">${status}</span>`;
            case 'In Progress': return `<span class="bg-blue-100 text-blue-800 dark:bg-blue-900 dark:text-blue-200 px-2 py-1 rounded text-xs font-semibold">${status}</span>`;
            default: return `<span class="bg-gray-100 text-gray-800 dark:bg-gray-700 dark:text-gray-300 px-2 py-1 rounded text-xs font-semibold">${status}</span>`;
        }
    }
</script>

</body>
</html>
