<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen RICEF SAP</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- HALAMAN LOGIN -->
<div class="container mt-5" id="loginPage">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h4 class="text-center mb-4">Login RICEF Tracker</h4>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label>Username</label>
                            <input type="text" class="form-control" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label>Password</label>
                            <input type="password" class="form-control" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" id="loginBtn">Masuk</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- HALAMAN UTAMA APLIKASI (Disembunyikan di awal) -->
<div class="container mt-4" id="appPage" style="display: none;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>RICEF Tracker SAP</h2>
        <button class="btn btn-danger" onclick="logout()">Logout</button>
    </div>

    <!-- Form Input -->
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <form id="ricefForm">
                <input type="hidden" id="ricefId" name="id">
                <div class="row mb-3">
                    <div class="col-md-2">
                        <label class="form-label">Type</label>
                        <select class="form-select" id="type" name="type" required>
                            <option value="Report">Report</option>
                            <option value="Interface">Interface</option>
                            <option value="Conversion">Conversion</option>
                            <option value="Enhancement">Enhancement</option>
                            <option value="Form">Form</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Module</label>
                        <input type="text" class="form-control" id="module" name="module" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Program Name</label>
                        <input type="text" class="form-control" id="program_name" name="program_name" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Status</label>
                        <select class="form-select" id="status" name="status" required>
                            <option value="Not Started">Not Started</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Testing">Testing</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="2" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary" id="saveBtn">Simpan Data</button>
                <button type="button" class="btn btn-secondary d-none" id="cancelBtn" onclick="resetForm()">Batal</button>
            </form>
        </div>
    </div>

    <!-- Table Data dengan DataTables -->
    <div class="card shadow-sm mb-5">
        <div class="card-body">
            <div class="table-responsive">
                <table id="ricefTable" class="table table-striped table-hover w-100">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Type</th>
                            <th>Module</th>
                            <th>Program Name</th>
                            <th>Description</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Data akan dirender oleh DataTables melalui JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- jQuery & DataTables JS -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

<script>
    // MASUKKAN URL WEB APP ANDA DI BAWAH INI
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz7AqV9Ke_xOIJCE9jtcsY8_QAd_kbkZUNUAWPcQKIWr1V9ad28OXy1ZG3N3OFzcI1R/exec';
    let dataTable;

    // Inisialisasi DataTables saat halaman dimuat
    $(document).ready(function() {
        dataTable = $('#ricefTable').DataTable();
        checkLoginStatus();
    });

    // --- LOGIKA LOGIN ---
    function checkLoginStatus() {
        if(sessionStorage.getItem('isLoggedIn') === 'true') {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('appPage').style.display = 'block';
            loadData();
        }
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        formData.append('action', 'login');
        const btn = document.getElementById('loginBtn');
        btn.innerText = "Memeriksa...";
        btn.disabled = true;

        fetch(SCRIPT_URL, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(res => {
                if(res.status === 'success') {
                    sessionStorage.setItem('isLoggedIn', 'true');
                    document.getElementById('loginPage').style.display = 'none';
                    document.getElementById('appPage').style.display = 'block';
                    loadData();
                } else {
                    alert('Username atau Password Salah!');
                }
                btn.innerText = "Masuk";
                btn.disabled = false;
            }).catch(err => {
                alert('Terjadi kesalahan jaringan.');
                btn.innerText = "Masuk";
                btn.disabled = false;
            });
    });

    function logout() {
        sessionStorage.removeItem('isLoggedIn');
        document.getElementById('appPage').style.display = 'none';
        document.getElementById('loginPage').style.display = 'block';
        document.getElementById('loginForm').reset();
    }

    // --- LOGIKA CRUD MENGGUNAKAN DATATABLES ---
    function loadData() {
        fetch(SCRIPT_URL + '?action=read')
            .then(res => res.json())
            .then(res => {
                dataTable.clear(); // Bersihkan tabel sebelum mengisi data baru

                if(res.data && res.data.length > 0) {
                    res.data.forEach(row => {
                        const descSafe = (row.Description || "").replace(/'/g, "\\'");
                        dataTable.row.add([
                            row.ID,
                            `<span class="badge bg-secondary">${row.Type}</span>`,
                            row.Module,
                            `<strong>${row.Program_Name}</strong>`,
                            row.Description,
                            `<span class="badge bg-${getStatusColor(row.Status)}">${row.Status}</span>`,
                            `<button class="btn btn-sm btn-warning mb-1" onclick="editData('${row.ID}', '${row.Type}', '${row.Module}', '${row.Program_Name}', '${descSafe}', '${row.Status}')">Edit</button>
                             <button class="btn btn-sm btn-danger mb-1" onclick="deleteData('${row.ID}')">Hapus</button>`
                        ]);
                    });
                }
                dataTable.draw(); // Render ulang tabel
            }).catch(err => console.error(err));
    }

    document.getElementById('ricefForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const id = document.getElementById('ricefId').value;
        const action = id ? 'update' : 'create';
        const formData = new FormData(this);
        formData.append('action', action);

        document.getElementById('saveBtn').innerText = "Menyimpan...";
        document.getElementById('saveBtn').disabled = true;

        fetch(SCRIPT_URL, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(res => {
                resetForm();
                loadData();
                document.getElementById('saveBtn').disabled = false;
            });
    });

    function deleteData(id) {
        if(confirm('Yakin ingin menghapus RICEF ini?')) {
            const formData = new FormData();
            formData.append('action', 'delete');
            formData.append('id', id);

            fetch(SCRIPT_URL, { method: 'POST', body: formData })
                .then(res => res.json())
                .then(res => loadData());
        }
    }

    function editData(id, type, module, prog_name, desc, status) {
        document.getElementById('ricefId').value = id;
        document.getElementById('type').value = type;
        document.getElementById('module').value = module;
        document.getElementById('program_name').value = prog_name;
        document.getElementById('description').value = desc;
        document.getElementById('status').value = status;

        document.getElementById('saveBtn').innerText = "Update Data";
        document.getElementById('cancelBtn').classList.remove('d-none');
        window.scrollTo(0,0);
    }

    function resetForm() {
        document.getElementById('ricefForm').reset();
        document.getElementById('ricefId').value = '';
        document.getElementById('saveBtn').innerText = "Simpan Data";
        document.getElementById('cancelBtn').classList.add('d-none');
    }

    function getStatusColor(status) {
        switch(status) {
            case 'Completed': return 'success';
            case 'Testing': return 'info';
            case 'In Progress': return 'primary';
            default: return 'secondary';
        }
    }
</script>

</body>
</html>
