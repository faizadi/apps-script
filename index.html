<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen RICEF SAP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-4">RICEF Tracker SAP</h2>

    <!-- Form Input -->
    <div class="card mb-4">
        <div class="card-body">
            <form id="ricefForm">
                <input type="hidden" id="ricefId" name="id">
                <div class="row mb-3">
                    <div class="col-md-2">
                        <label class="form-label">Type</label>
                        <select class="form-select" id="type" name="type" required>
                            <option value="Report">Report</option>
                            <option value="Interface">Interface</option>
                            <option value="Conversion">Conversion</option>
                            <option value="Enhancement">Enhancement</option>
                            <option value="Form">Form</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Module</label>
                        <input type="text" class="form-control" id="module" name="module" placeholder="FICO, MM, SD..." required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Program Name</label>
                        <input type="text" class="form-control" id="program_name" name="program_name" placeholder="ZFI_REPORT_01" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Status</label>
                        <select class="form-select" id="status" name="status" required>
                            <option value="Not Started">Not Started</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Testing">Testing</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="2" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary" id="saveBtn">Simpan Data</button>
                <button type="button" class="btn btn-secondary d-none" id="cancelBtn" onclick="resetForm()">Batal</button>
            </form>
        </div>
    </div>

    <!-- Table Data -->
    <div class="card">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Type</th>
                            <th>Module</th>
                            <th>Program Name</th>
                            <th>Description</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="dataTable">
                        <tr><td colspan="7" class="text-center">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // MASUKKAN URL WEB APP ANDA DI BAWAH INI
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz7AqV9Ke_xOIJCE9jtcsY8_QAd_kbkZUNUAWPcQKIWr1V9ad28OXy1ZG3N3OFzcI1R/exec';

    // Fungsi Load Data
    function loadData() {
        fetch(SCRIPT_URL + '?action=read')
            .then(res => res.json())
            .then(res => {
                const tbody = document.getElementById('dataTable');
                tbody.innerHTML = '';
                if(res.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center">Belum ada data</td></tr>';
                    return;
                }
                res.data.forEach(row => {
                    // Escape petik tunggal agar tidak error di onclick
                    const descSafe = (row.Description || "").replace(/'/g, "\\'");
                    tbody.innerHTML += `
                        <tr>
                            <td>${row.ID}</td>
                            <td><span class="badge bg-secondary">${row.Type}</span></td>
                            <td>${row.Module}</td>
                            <td><strong>${row.Program_Name}</strong></td>
                            <td>${row.Description}</td>
                            <td><span class="badge bg-${getStatusColor(row.Status)}">${row.Status}</span></td>
                            <td>
                                <button class="btn btn-sm btn-warning mb-1" onclick="editData('${row.ID}', '${row.Type}', '${row.Module}', '${row.Program_Name}', '${descSafe}', '${row.Status}')">Edit</button>
                                <button class="btn btn-sm btn-danger mb-1" onclick="deleteData('${row.ID}')">Hapus</button>
                            </td>
                        </tr>
                    `;
                });
            }).catch(err => console.error(err));
    }

    // Handle Form Submit (Create & Update)
    document.getElementById('ricefForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const id = document.getElementById('ricefId').value;
        const action = id ? 'update' : 'create';
        const formData = new FormData(this);
        formData.append('action', action);

        document.getElementById('saveBtn').innerText = "Menyimpan...";

        fetch(SCRIPT_URL, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(res => {
                resetForm();
                loadData();
            });
    });

    // Fungsi Delete Data
    function deleteData(id) {
        if(confirm('Yakin ingin menghapus RICEF ini?')) {
            const formData = new FormData();
            formData.append('action', 'delete');
            formData.append('id', id);

            fetch(SCRIPT_URL, { method: 'POST', body: formData })
                .then(res => res.json())
                .then(res => loadData());
        }
    }

    // Fungsi Set Data ke Form (Untuk Update)
    function editData(id, type, module, prog_name, desc, status) {
        document.getElementById('ricefId').value = id;
        document.getElementById('type').value = type;
        document.getElementById('module').value = module;
        document.getElementById('program_name').value = prog_name;
        document.getElementById('description').value = desc;
        document.getElementById('status').value = status;

        document.getElementById('saveBtn').innerText = "Update Data";
        document.getElementById('cancelBtn').classList.remove('d-none');
        window.scrollTo(0,0);
    }

    // Fungsi Reset Form
    function resetForm() {
        document.getElementById('ricefForm').reset();
        document.getElementById('ricefId').value = '';
        document.getElementById('saveBtn').innerText = "Simpan Data";
        document.getElementById('cancelBtn').classList.add('d-none');
    }

    // Helper: Warna Badge Status
    function getStatusColor(status) {
        switch(status) {
            case 'Completed': return 'success';
            case 'Testing': return 'info';
            case 'In Progress': return 'primary';
            default: return 'secondary';
        }
    }

    // Load data saat halaman pertama kali dibuka
    window.onload = loadData;
</script>

</body>
</html>
